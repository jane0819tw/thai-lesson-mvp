<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>%%SONG_TITLE_ZH%% — 泰時刻歌詞學習</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9841A;--gm:#E8A93A;--cr:#FDF8EF;--cd:#F5EDD8;--br:#5C3A1E;--bm:#8B5E34;--tt:#AA8860;--bd:#E8D5B0;--bs:#C9A870;--hl:#FEF3D0;--hb:#E8A93A;}
body{background:var(--cr);color:var(--br);font-family:"Noto Sans TC",sans-serif;min-height:100vh;}
.pg{max-width:760px;margin:0 auto;padding:2rem 1.5rem 5rem;}
.hd{text-align:center;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1.5px solid var(--bd);}
.bn{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.t1{font-family:"Sarabun",sans-serif;font-size:28px;font-weight:700;color:var(--br);margin-bottom:3px;}
.t2{font-size:14px;color:var(--bm);margin-bottom:5px;}
.t3{font-size:11px;color:var(--tt);margin-bottom:1rem;}
.yt-embed{position:relative;width:100%;padding-bottom:56.25%;border-radius:10px;overflow:hidden;border:1px solid var(--bd);margin-bottom:.75rem;}
.yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.yt-btn-wrap{text-align:center;}
.yt-btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:white;text-decoration:none;padding:10px 22px;border-radius:24px;font-size:13px;font-family:"Noto Sans TC",sans-serif;transition:background .15s;}
.yt-btn:hover{background:var(--gm);}
.legend{display:flex;align-items:center;gap:16px;margin:1rem 0 .2rem;flex-wrap:wrap;font-size:11px;color:var(--bm);}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-dot{width:12px;height:12px;border-radius:3px;background:rgba(201,132,26,0.25);}

/* 控制列 */
.ct{display:flex;align-items:center;gap:7px;margin:.6rem 0 .8rem;flex-wrap:wrap;}
.cb{padding:5px 14px;border-radius:20px;border:1px solid var(--bs);background:white;color:var(--bm);font-size:12px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:all .12s;}
.cb:hover{background:var(--cd);}
.cb.on{background:var(--gold);border-color:var(--gold);color:white;}
.sa{margin-left:auto;padding:6px 16px;border-radius:20px;border:1.5px solid var(--bs);background:white;color:var(--bm);font-size:12px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;display:flex;align-items:center;gap:5px;transition:all .12s;}
.sa:hover{border-color:var(--gold);color:var(--gold);}

.pb{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.pt{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden;}
.pf{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;}
.pl{font-size:11px;color:var(--tt);white-space:nowrap;}

/* 句子區塊 */
.lb{padding:.85rem 1rem .2rem;border-radius:10px;margin-bottom:4px;border:1.5px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;}
.lb:hover{background:var(--cd);}
.lb.on{background:var(--hl);border-color:var(--hb);}
.ln{font-size:9px;color:var(--tt);letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
.sp{background:none;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:10px;color:var(--tt);cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:all .1s;}
.sp:hover{border-color:var(--gold);color:var(--gold);}

/* ── 斷句模式 OFF：只顯示整句泰文 ── */
.line-thai-full{font-family:"Sarabun",sans-serif;font-size:22px;color:var(--br);line-height:1.6;margin-bottom:6px;word-spacing:0;letter-spacing:0.01em;}
.wr{display:none;}          /* 關閉時隱藏單字列 */
.expand-area{display:none;} /* 關閉時隱藏展開區 */

/* ── 斷句模式 ON：隱藏整句、顯示單字列 ── */
.seg-on .line-thai-full{display:none;}
.seg-on .wr{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;}
.seg-on .expand-area{display:block;}

/* 單字單位 */
.wu{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;}
.wt{font-family:"Sarabun",sans-serif;font-size:20px;font-weight:400;color:var(--br);line-height:1.3;text-align:center;white-space:nowrap;border-bottom:2px solid var(--bs);padding-bottom:2px;width:100%;}
.wt.red{color:#C0392B;border-bottom-color:#C0392B;}
.wp{font-size:10px;color:var(--tt);line-height:1.5;text-align:center;white-space:nowrap;margin-top:2px;}
.wm{font-size:11px;color:var(--bm);font-weight:500;line-height:1.3;text-align:center;white-space:nowrap;}
.wm.red{color:#C0392B;}

/* 有例句的字底色 */
.wu.has-ex .wt{background:rgba(201,132,26,0.15);border-radius:4px 4px 0 0;padding-left:3px;padding-right:3px;cursor:pointer;}
.wu.has-ex:hover .wt,.wu.has-ex.open .wt{background:rgba(201,132,26,0.28);}

/* 展開說明區 */
.expand-area{width:100%;margin-top:10px;overflow:hidden;max-height:0;transition:max-height .25s ease,opacity .2s ease;opacity:0;}
.expand-area.open{max-height:220px;opacity:1;}
/* seg-on 時重設 expand-area 為可動畫 */
.seg-on .expand-area{max-height:0;opacity:0;transition:max-height .25s ease,opacity .2s ease;}
.seg-on .expand-area.open{max-height:220px;opacity:1;}

.expand-inner{border-radius:8px;padding:.65rem .9rem;margin-bottom:10px;font-size:12px;line-height:1.7;background:#FFF8EC;border-left:3px solid #E8A93A;}
.expand-label{font-size:11px;font-weight:600;color:#C9841A;margin-bottom:4px;}
.expand-thai{font-family:"Sarabun",sans-serif;font-size:15px;color:var(--br);margin-bottom:2px;}
.expand-ph{font-size:10px;color:var(--tt);margin-bottom:3px;}
.expand-zh{font-size:12px;color:var(--bm);font-style:italic;}

.tr{font-size:12px;color:var(--tt);font-style:italic;padding:.5rem 0 .75rem;border-top:1px dashed var(--bd);margin-top:8px;}
.nv{display:flex;gap:8px;margin-top:2rem;justify-content:center;}
.nb{padding:9px 22px;border-radius:22px;border:1.5px solid var(--bs);background:white;color:var(--bm);font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:all .12s;}
.nb:hover{background:var(--cd);}
.nb.pr{background:var(--gold);border-color:var(--gold);color:white;}
.nb.pr:hover{background:var(--gm);}
</style>
</head>
<body>
<div class="pg">
  <div class="hd">
    <p class="bn">泰時刻 · 泰語歌詞學習</p>
    <p class="t1">%%SONG_TITLE_TH%%</p>
    <p class="t2">%%SONG_TITLE_ZH%%</p>
    <p class="t3">%%SONG_ARTIST%%</p>
    <div class="yt-embed">
      <iframe src="https://www.youtube.com/embed/%%YOUTUBE_ID%%?rel=0&modestbranding=1" title="ยิ่งรู้จักยิ่งรักเธอ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="yt-btn-wrap">
      <a class="yt-btn" href="https://www.youtube.com/watch?v=%%YOUTUBE_ID%%" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.37 6.37 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
        在 YouTube 觀看 MV
      </a>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot"></div>點擊查看語法說明 / 例句</div>
  </div>

  <div class="ct">
    <button class="cb" id="b-seg" onclick="toggleSeg()">斷句模式</button>
    <button class="sa" onclick="speakAll()">&#128266; 朗讀全曲</button>
  </div>

  <div class="pb">
    <div class="pt"><div class="pf" id="pf" style="width:0%"></div></div>
    <span class="pl" id="pl">0 / %%TOTAL%% 句</span>
  </div>
  <div id="la"></div>
  <div class="nv">
    <button class="nb" onclick="move(-1)">← 上一句</button>
    <button class="nb pr" onclick="move(1)">下一句 →</button>
  </div>
</div>

<script>
const L=%%LYRICS_JSON%%;
let cur=-1, openState=null, segOn=false;

function closeOpen(){
  if(openState){openState.expandEl.classList.remove('open');openState.wuEl.classList.remove('open');openState=null;}
}
const spk=t=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=0.82;speechSynthesis.speak(u);}};
const speakAll=()=>spk(L.map(l=>l.thai).join(' '));

function toggleSeg(){
  segOn=!segOn;
  document.getElementById('b-seg').classList.toggle('on', segOn);
  document.getElementById('la').classList.toggle('seg-on', segOn);
  if(!segOn) closeOpen();
}

function sel(i){
  document.querySelectorAll('.lb').forEach((b,j)=>b.classList.toggle('on',j===i));
  cur=i;
  document.getElementById('pf').style.width=Math.round((i+1)/L.length*100)+'%';
  document.getElementById('pl').textContent=(i+1)+' / '+L.length+' 句';
}
function move(d){
  const n=cur<0?0:Math.max(0,Math.min(L.length-1,cur+d));
  sel(n);document.getElementById('l'+n).scrollIntoView({behavior:'smooth',block:'center'});
}
function buildInner(data){
  const div=document.createElement('div');div.className='expand-inner';
  div.innerHTML='<div class="expand-label">📖 語法說明　'+data.meaning+'</div>'
    +'<div class="expand-thai">'+data.thai+'</div>'
    +'<div class="expand-ph">'+data.phonetic+'</div>'
    +'<div class="expand-zh">'+data.chinese+'</div>';
  return div;
}
function render(){
  const la=document.getElementById('la');
  L.forEach((line,i)=>{
    const lb=document.createElement('div');lb.className='lb';lb.id='l'+i;
    lb.onclick=e=>{if(!e.target.closest('.sp')&&!e.target.closest('.wu'))sel(i);};

    const nr=document.createElement('div');nr.className='ln';
    nr.appendChild(document.createTextNode('第'+(i+1)+'句'));
    const s=document.createElement('button');s.className='sp';s.textContent='▶ 朗讀';
    s.onclick=e=>{e.stopPropagation();spk(line.thai);};
    nr.appendChild(s);

    // 整句泰文（斷句模式 OFF 時顯示）
    const fullThai=document.createElement('div');fullThai.className='line-thai-full';
    fullThai.textContent=line.words.map(w=>w.t).join('');

    // 單字列（斷句模式 ON 時顯示）
    const wr=document.createElement('div');wr.className='wr';
    const expandArea=document.createElement('div');expandArea.className='expand-area';

    line.words.forEach(w=>{
      const hasEx=!!w.ex;
      const wu=document.createElement('div');wu.className='wu'+(hasEx?' has-ex':'');
      const isRed=w.red===true;
      const wt=document.createElement('span');wt.className=isRed?'wt red':'wt';wt.textContent=w.t;
      const wp=document.createElement('span');wp.className='wp';wp.textContent=w.p;
      const wm=document.createElement('span');wm.className=isRed?'wm red':'wm';wm.textContent=w.z;
      wu.appendChild(wt);wu.appendChild(wp);wu.appendChild(wm);
      if(hasEx){
        wt.addEventListener('click',e=>{
          e.stopPropagation();sel(i);
          if(openState&&openState.wuEl===wu){closeOpen();return;}
          closeOpen();
          expandArea.innerHTML='';
          expandArea.appendChild(buildInner(w.ex));
          expandArea.classList.add('open');
          wu.classList.add('open');
          openState={lbEl:lb,expandEl:expandArea,wuEl:wu};
        });
      }
      wr.appendChild(wu);
    });

    const tr=document.createElement('div');tr.className='tr';tr.textContent=line.tr;
    lb.appendChild(nr);
    lb.appendChild(fullThai);
    lb.appendChild(wr);
    lb.appendChild(expandArea);
    lb.appendChild(tr);
    la.appendChild(lb);
  });
}
render();
</script>
</body>
</html>
